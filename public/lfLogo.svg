<svg viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bottle Liquid Gradient -->
    <linearGradient id="lf_v_bottle_liq" x1="240" y1="70" x2="310" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9D00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <!-- Drop Teardrop Gradient -->
    <linearGradient id="lf_v_drop" x1="228" y1="95" x2="228" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC700" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <!-- Cocktail Liquid Fill Gradient -->
    <linearGradient id="lf_v_glass_liq" x1="160" y1="110" x2="255" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFBA00" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#D93800" />
    </linearGradient>

    <!-- Chart Bars Gradients -->
    <linearGradient id="lf_v_bar1" x1="230" y1="180" x2="260" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#123B7A" />
      <stop offset="100%" stop-color="#0B234C" />
    </linearGradient>
    <linearGradient id="lf_v_bar2" x1="272" y1="140" x2="304" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F2E63" />
      <stop offset="100%" stop-color="#0A1C3C" />
    </linearGradient>
    <linearGradient id="lf_v_bar3" x1="314" y1="100" x2="346" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2147" />
      <stop offset="100%" stop-color="#061228" />
    </linearGradient>

    <!-- Wave Orange Gradient -->
    <linearGradient id="lf_v_wave_orange" x1="130" y1="190" x2="290" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#E64A00" />
    </linearGradient>

    <!-- Wave Royal Blue Glossy 3D Gradient -->
    <linearGradient id="lf_v_wave_blue" x1="130" y1="210" x2="380" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091838" />
      <stop offset="25%" stop-color="#004DA8" />
      <stop offset="65%" stop-color="#0077FF" />
      <stop offset="100%" stop-color="#0040A8" />
    </linearGradient>

    <!-- Wave Gloss Highlight -->
    <linearGradient id="lf_v_wave_highlight" x1="220" y1="205" x2="370" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0077FF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Typography Gradients -->
    <linearGradient id="lf_txt_liquor" x1="110" y1="310" x2="280" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <linearGradient id="lf_txt_flow" x1="285" y1="310" x2="400" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#0033A0" />
    </linearGradient>
  </defs>

  <!-- 1. Bar Chart -->
  <rect x="232" y="180" width="28" height="60" rx="3" fill="url(#lf_v_bar1)" />
  <rect x="272" y="140" width="28" height="100" rx="3" fill="url(#lf_v_bar2)" />
  <rect x="312" y="100" width="28" height="140" rx="3" fill="url(#lf_v_bar3)" />

  <!-- 2. Pouring Bottle -->
  <g id="lf_pouring_bottle">
    <path d="M234 84 L310 60 C316 58 322 62 323 68 L320 84 C319 89 314 93 308 95 L242 106 C236 107 230 103 229 97 L228 90 C227 86 230 84 234 84 Z" fill="#0B132B" />
    <path d="M234 84 L226 85 C222 86 220 89 220 93 L220 95 C220 99 222 102 226 103 L234 102 Z" fill="#080D1F" />
    <path d="M250 78 L304 68 C308 67 312 70 312 74 L310 82 C309 85 306 87 302 88 L256 94 C252 95 248 92 247 88 L247 84 C246 80 248 78 250 78 Z" fill="url(#lf_v_bottle_liq)" />
  </g>

  <!-- 3. Pouring Drop -->
  <path d="M228 102 C228 102 218 114 218 120 C218 126 222 130 228 130 C234 130 238 126 238 120 C238 114 228 102 228 102 Z" fill="url(#lf_v_drop)" />

  <!-- 4. Cocktail Glass -->
  <g id="lf_martini_glass">
    <path d="M166 128 L250 128 C248 138 222 182 210 182 C198 182 170 138 166 128 Z" fill="url(#lf_v_glass_liq)" />
    <circle cx="192" cy="150" r="4.5" fill="#FFE800" opacity="0.95" />
    <circle cx="204" cy="162" r="3.5" fill="#FFE800" opacity="0.9" />
    <circle cx="216" cy="144" r="5" fill="#FFE800" opacity="0.95" />
    <path d="M163 128 C168 124 248 124 253 128 C248 132 168 132 163 128 Z" fill="#FFE800" />
    <path d="M150 114 L204 192 L204 235 L182 240 C177 241 175 245 176 250 C177 255 182 258 188 258 L232 258 C238 258 243 255 244 250 C245 245 243 241 238 240 L216 235 L216 192 L270 114 C273 110 270 105 265 105 L155 105 C150 105 147 110 150 114 Z" fill="#0B132B" />
    <path d="M160 115 L210 180 L260 115 Z" fill="#0B132B" opacity="0.12" />
  </g>

  <!-- 5. Waves -->
  <path d="M120 220 C140 192 200 180 245 204 C280 222 315 212 355 195 C325 215 285 236 240 222 C195 208 150 210 120 220 Z" fill="url(#lf_v_wave_orange)" />
  <path d="M118 226 C165 208 220 225 260 232 C310 240 355 212 368 150 C372 195 340 238 280 242 C230 245 170 232 118 226 Z" fill="#081024" />
  <path d="M122 232 C172 215 225 234 268 240 C322 248 370 218 382 148 C386 198 350 248 288 250 C232 252 172 238 122 232 Z" fill="url(#lf_v_wave_blue)" />
  <path d="M232 234 C278 242 335 228 372 172 C362 208 318 242 262 242 C250 242 240 238 232 234 Z" fill="url(#lf_v_wave_highlight)" />

  <!-- 6. Typography -->
  <text x="110" y="325" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="url(#lf_txt_liquor)" letter-spacing="-1">Liquor</text>
  <text x="282" y="325" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="url(#lf_txt_flow)" letter-spacing="-1">Flow</text>

  <!-- ERP Pill -->
  <rect x="202" y="348" width="96" height="26" rx="13" fill="#0C1838" />
  <text x="250" y="365" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ERP</text>
  <line x1="140" y1="361" x2="190" y2="361" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <line x1="310" y1="361" x2="360" y2="361" stroke="#334155" stroke-width="2" stroke-linecap="round" />
</svg>
